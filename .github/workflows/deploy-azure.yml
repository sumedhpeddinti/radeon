name: Build and Push Medusa Container

on:
  push:
    branches:
      - radeon
    paths:
      - 'backend/**'
      - 'store-userview/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'start.sh'
      - '.github/workflows/deploy-azure.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/radeon:latest

      - name: Trigger Azure Deployment Webhook
        if: ${{ env.AZURE_WEBHOOK_URL != '' }}
        env:
          AZURE_WEBHOOK_URL: ${{ secrets.AZURE_WEBHOOK_URL }}
        run: |
          echo "Triggering Azure App Service webhook..."
          curl -s -X POST "$AZURE_WEBHOOK_URL"
          echo "Azure webhook triggered successfully."
