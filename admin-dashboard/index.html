<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radeon Admin Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/logo-icon.png">
  <link rel="stylesheet" href="http://localhost:9000/app/assets/app.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    // Import the dashboard app from the Medusa backend
    import('http://localhost:9000/app/assets/app.mjs')
      .then(module => {
        console.log('Dashboard loaded successfully');
      })
      .catch(error => {
        console.error('Failed to load dashboard:', error);
        document.getElementById('root').innerHTML = `
          <div style="padding: 40px; text-align: center;">
            <h1>Medusa Admin Dashboard</h1>
            <p>Loading dashboard from backend...</p>
            <p>If this doesn't load, make sure the backend is running at http://localhost:9000</p>
          </div>
        `;
      });
  </script>
</body>
</html>
