user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream medusa_backend {
        server 127.0.0.1:9001;
    }

    upstream nextjs_storefront {
        server 127.0.0.1:8000;
    }

    server {
        listen 9000;
        server_name _;

        # Production Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "hid=(), usb=(), bluetooth=(), digital-credentials-get=(), camera=(), microphone=(), geolocation=()" always;

        # Azure HealthCheck Probe
        location = /robots933456.txt {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Medusa Admin Dashboard (/app)
        location /app {
            proxy_pass http://medusa_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_domain 127.0.0.1:9001 $http_host;
            proxy_cookie_domain localhost:9001 $http_host;
            proxy_cookie_path / "/";
        }

        # Next.js Storefront Catalog page (/store exact)
        location = /store {
            proxy_pass http://nextjs_storefront;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /store/ {
            proxy_pass http://nextjs_storefront;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Medusa APIs (/store/..., /admin, /auth, /health, /cloud, /uploads, /static)
        location ~ ^/(store/|admin|auth|health|cloud|uploads|static) {
            proxy_pass http://medusa_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_domain 127.0.0.1:9001 $http_host;
            proxy_cookie_domain localhost:9001 $http_host;
            proxy_cookie_path / "/";
        }

        # Next.js Static Assets
        location /_next/static/ {
            proxy_pass http://nextjs_storefront;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Next.js Storefront (Root and all customer routes)
        location / {
            proxy_pass http://nextjs_storefront;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
